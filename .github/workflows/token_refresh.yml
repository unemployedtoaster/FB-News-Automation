name: Token refresh — Keep FB token alive

on:
  schedule:
    # Every Sunday at 06:00 UTC — long-lived tokens last 60 days, weekly refresh is safe
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      # Needed to write the refreshed token back to repo secrets via API
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests

      - name: Refresh Facebook token
        env:
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}        # Personal access token with secrets:write scope
          GH_REPO: ${{ github.repository }}
        run: python token_refresh.py
